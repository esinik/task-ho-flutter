name: taskho
description: TaskHo — organize your work, own your time.
publish_to: "none"
version: 1.0.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: any
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  flutter_phoenix: ^1.1.1
  window_manager: ^0.5.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  firebase_remote_config: ^6.1.1
  firebase_core: ^4.2.1
  file_picker: ^10.3.6
  path: ^1.9.1
  uuid: ^4.5.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
